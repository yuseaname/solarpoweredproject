{{- /* faq-schema-render.html — Outputs FAQPage JSON-LD collected by faq shortcode */ -}}
{{- $faqs := .Page.Store.Get "faqs" -}}
{{- if and $faqs (gt (len $faqs) 0) -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {{- $last := sub (len $faqs) 1 -}}
    {{- range $i, $faq := $faqs -}}
    {
      "@type": "Question",
      "name": {{ $faq.q | jsonify | safeJS }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ $faq.a | jsonify | safeJS }}
      }
    }{{- if lt $i $last }},{{ end -}}
    {{- end -}}
  ]
}
</script>
{{- end -}}
