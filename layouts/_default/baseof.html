<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}">
<head>{{ partial "head.html" . }}</head>
<body class="site-body {{ if .IsHome }}page-home{{ end }}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  {{ partial "nav.html" . }}
  <main id="main-content" tabindex="-1">{{ block "main" . }}{{ end }}</main>
  {{ partial "footer.html" . }}
  {{ with resources.Get "js/main.js" }}<script src="{{ .RelPermalink }}" defer></script>{{ end }}
  {{ partial "rybbit-analytics.html" . }}
</body>
</html>
