name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.141.0'
          extended: true
      - name: Build Hugo content
        run: |
          rm -rf public/
          hugo --minify --gc

      - name: Verify homepage build
        run: |
          echo "public/index.html size:"
          wc -c public/index.html
          echo "New article titles present:"
          grep -o 'Best Solar Batteries\|Solar Payback Calculator' public/index.html | sort | uniq -c

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -H -p 65002 "${{ secrets.HOSTINGER_SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 65002" \
            ./public/ \
            "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:~/domains/solarpoweredproject.com/public_html/"
      - name: Clear Hostinger/LiteSpeed page cache
        run: |
          ssh -i ~/.ssh/deploy_key -p 65002 "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}" \
            "rm -rf ~/lscache 2>/dev/null; rm -rf ~/domains/solarpoweredproject.com/public_html/.lscache 2>/dev/null; find ~/domains/solarpoweredproject.com/public_html -type d -name 'lscache' -exec rm -rf {} + 2>/dev/null; echo cache cleared" || true
