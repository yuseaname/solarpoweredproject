baseURL = 'https://solarpoweredproject.com/'
languageCode = 'en-us'
title = 'Solar Powered Project'
theme = 'adsense-base'
disableHugoGeneratorInject = true
uglyURLs = true

disableKinds = ['taxonomy', 'term']

[params]
  site_name = 'Solar Powered Project'
  description = 'Practical field guides for independent power systems: solar, batteries, wiring, costs, and reality-checked off-grid projects.'
  tagline = 'Practical independent power, made clearer.'
  author = 'Solar Powered Project'
  favicon = '/assets/images/solarpoweredproject-logo.png'
  og_image = '/assets/images/field-guide/social-og-fallback.jpg'
  google_site_verification = ''

  [params.adsense]
    client_id = 'ca-pub-5566942094411042'
    [params.adsense.slots]
      below_title = { id = '9770352885', format = 'auto', responsive = 'true' }
      mid_article = { id = '7429084400', format = 'auto', responsive = 'true' }
      end_article = { id = '3364726638', format = 'auto', responsive = 'true' }

  [params.rybbit]
    instance_url = 'https://app.rybbit.io'
    site_id = 'afb6050c297b'

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ['HTML']

[markup.goldmark]
  [markup.goldmark.renderer]
    unsafe = true

ignoreLogs = ['warning-goldmark-raw-html']
ignoreFiles = ['^static/.*\.html$']
