{{- $type := .Get "type" | default "info" -}}
{{- $title := .Get "title" -}}
{{- $labels := dict "info" "Field Note" "warning" "Reality Check" "tip" "Next Decision" "danger" "Safety Gate" -}}
<aside class="callout callout-{{ $type }}" role="note">
  <p class="callout-title">{{ $title | default (index $labels $type) }}</p>
  <div class="callout-content">{{ .Inner | markdownify }}</div>
</aside>
